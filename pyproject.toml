[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse"
version = "0.1.0"
description = "Automated Network Validation & Performance Testing Framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NetPulse Engineering Team" }
]
license = { text = "MIT" }
dependencies = [
    "pytest>=7.4.0",
    "pytest-html>=4.0.0",
    "pytest-json-report>=1.5.0",
    "PyYAML>=6.0",
    "scapy>=2.5.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "tcp: TCP protocol test cases",
    "udp: UDP protocol test cases",
    "http: HTTP protocol test cases",
    "functional: Functional behavior test cases",
    "regression: Regression test cases verifying baseline invariants",
    "integration: Multi-component end-to-end integration test cases",
    "performance: Network performance and latency benchmarks",
    "unit: Unit tests for core framework modules",
    "requires_root: Tests requiring elevated / raw socket capabilities (CAP_NET_RAW)"
]
addopts = "-ra --strict-markers -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
