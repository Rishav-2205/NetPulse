version: '3.8'

services:
  # 1. Functional Test Runner (Unprivileged)
  netpulse-functional:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netpulse-functional-runner
    volumes:
      - ../reports:/netpulse/reports
      - ../logs:/netpulse/logs
    environment:
      - NETPULSE_NETWORK_TCP_TIMEOUT=5.0
      - NETPULSE_NETWORK_UDP_TIMEOUT=3.0
    command: ["pytest", "tests/functional", "tests/unit", "tests/integration", "-v"]

  # 2. Regression & Baseline Verification Runner
  netpulse-regression:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netpulse-regression-runner
    volumes:
      - ../reports:/netpulse/reports
      - ../logs:/netpulse/logs
    command: ["python", "-m", "netpulse", "regression"]

  # 3. Performance Benchmark & Report Generator
  netpulse-performance:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netpulse-performance-runner
    volumes:
      - ../reports:/netpulse/reports
      - ../logs:/netpulse/logs
    command: ["python", "-m", "netpulse", "benchmark", "--profile", "standard", "--html"]

  # 4. Privileged Raw Packet & Live Sniffing Runner (CAP_NET_RAW / CAP_NET_ADMIN)
  netpulse-raw-capable:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netpulse-raw-runner
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ../reports:/netpulse/reports
      - ../logs:/netpulse/logs
    command: ["python", "-m", "netpulse", "capture", "--packets", "20"]

  # 5. Live Web Control Center & REST/WebSocket Server
  netpulse-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netpulse-control-center
    ports:
      - "8000:8000"
    volumes:
      - ../reports:/netpulse/reports
      - ../logs:/netpulse/logs
    command: ["netpulse", "serve", "--host", "0.0.0.0", "--port", "8000"]

