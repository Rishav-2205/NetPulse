# NetPulse Test Profiles

quick:
  network:
    tcp_timeout: 2.0
    udp_timeout: 1.0
    http_timeout: 2.0
    buffer_size: 4096
  testing:
    retries: 1
    duration_seconds: 1.0
    packet_count: 50
  performance:
    duration: 1.0
    packet_count: 200
    packet_sizes: [64, 1024, 8192]
    concurrency: 1
  logging:
    level: "INFO"

